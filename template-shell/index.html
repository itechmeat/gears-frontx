<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrontX</title>
    <!--
      Cascade-layer order for the whole document, declared before any stylesheet
      loads so it is this line that fixes it rather than whichever sheet the
      bundler happened to emit first.

      `base` and `theme` are @constructor/globals' own layers, `ui` is the one
      every @constructor/react-kit component sheet writes into, and the three
      `tw-*` layers are where `src-app/app/globals.css` puts Tailwind. Preflight
      sits at the bottom, so it can no longer strip the kit's own styling (its
      `button { background-color: transparent }` is the measured case), while
      Tailwind utilities stay at the top and keep working in the shell chrome
      and the Studio panel.
    -->
    <style>
      @layer tw-base, base, theme, ui, tw-components, tw-utilities;
    </style>
    <!--
      Constructor design system (@constructor/globals), at document level so its
      tokens inherit into every MFE shadow root.

      Plain <link> elements on purpose, never a CSS or JS import: the app's
      PostCSS pipeline runs Tailwind over anything Vite processes, and Tailwind
      silently drops the icon-sizing rule, collapsing every kit icon to 0x0.
      `scripts/sync-acv-globals.mjs` carries the measurement; it also produces
      these two files under public/acv/ and runs from predev/prebuild.
    -->
    <link rel="stylesheet" href="/acv/base.css" />
    <link rel="stylesheet" href="/acv/themes/constructor/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src-app/app/main.tsx"></script>
  </body>
</html>
